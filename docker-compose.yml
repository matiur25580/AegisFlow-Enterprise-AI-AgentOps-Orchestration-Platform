name: aegisflow-local

services:
  mongodb:
    image: mongo:7.0
    container_name: aegisflow-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_DATABASE: aegisflow
    volumes:
      - aegisflow-mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    security_opt:
      - no-new-privileges:true

volumes:
  aegisflow-mongodb-data:
